[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "notnews"
dynamic = ["version"]
description = "Predict Soft News"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Suriyan Laohaprapanon", email = "suriyant@gmail.com"},
    {name = "Gaurav Sood", email = "gsood07@gmail.com"}
]
keywords = ["soft news", "classification", "machine learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities"
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.22.0,<3.0.0",
    "pandas>=1.3.0",
    "pyarrow>=18",
    "requests",
    "beautifulsoup4>=4.11.0",
    "click>=8.0.0",
    "huggingface-hub>=0.23"
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.18.0",
    "openai>=1.12.0"
]

[dependency-groups]
docs = [
    "sphinx>=8",
    "py-canon @ git+https://github.com/gojiplus/py-canon@v1",
    "furo",
    "myst-parser",
    "sphinx-copybutton",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
    "ruff>=0.7.0",
    "pyright>=1.1.390",
    "pre-commit>=3.0",
]
model-training = [
    "joblib>=1.5",
    "scikit-learn==1.7.2",
]
test = [
    "joblib>=1.5",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
    "scikit-learn==1.7.2",
]

[project.urls]
Homepage = "https://github.com/notnews/notnews"
Repository = "https://github.com/notnews/notnews"
Documentation = "https://notnews.github.io/notnews/"
"Bug Tracker" = "https://github.com/notnews/notnews/issues"

[project.scripts]
notnews = "notnews.cli:cli"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"

[tool.hatch.build.targets.wheel]
packages = ["notnews"]

[tool.hatch.build.targets.sdist]
include = [
    "/CHANGELOG.md",
    "/CITATION.cff",
    "/LICENSE",
    "/README.md",
    "/notnews",
    "/pyproject.toml",
]

[tool.hatch.build]
exclude = [
    "/.github",
    "/.venv",
    "/docs",
    "/tests",
    "/.pre-commit-config.yaml",
]


# Ruff configuration
[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "docs",
    ".eggs",
    "*.ipynb",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # imported but unused
"tests/*" = ["S101"]  # use of assert

[tool.ruff.lint.isort]
known-first-party = ["notnews"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = "test_*.py"
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=notnews",
    "--cov-report=term-missing",
    "-m",
    "not live",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "live: downloads the pinned Hugging Face artifacts",
]

# Coverage configuration
[tool.coverage.run]
source = ["notnews"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.pyright]
# The shipped package; streamlit/ is a demo app and tests/ is fixtures.
include = ["notnews"]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-class-attributes = false
allow-init-docstring = true
exclude = '\.venv|tests|docs'
